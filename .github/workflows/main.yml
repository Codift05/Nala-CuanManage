name: NALA CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nala_user
          POSTGRES_PASSWORD: nala_password
          POSTGRES_DB: nala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nala_user -d nala_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nala_user:nala_password@localhost:5432/nala_test
      JWT_SECRET: nala_ci_only_secret
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: ""
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx prisma migrate deploy
      - run: npm run seed
      - name: Start backend
        run: |
          npm start > /tmp/nala-backend.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/health && exit 0
            sleep 1
          done
          cat /tmp/nala-backend.log
          exit 1
      - run: npm run test:integration

  mobile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Mobile integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
          xvfb-run -a flutter test integration_test/auth_shell_test.dart -d linux
          xvfb-run -a flutter test integration_test/transaction_flow_test.dart -d linux --dart-define=API_BASE_URL=http://127.0.0.1:39091/api
          xvfb-run -a flutter test integration_test/receipt_flow_test.dart -d linux --dart-define=API_BASE_URL=http://127.0.0.1:39092/api
